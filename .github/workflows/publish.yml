name: Publish

# Publishes to npm when a v* tag is pushed:
#   npm version patch   # bumps package.json + plugin.json, commits, tags
#   git push --follow-tags
#
# Requires the NPM_TOKEN repository secret (an npm automation token).
# Without it, publish manually with `npm publish` after `npm login`.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm test
      - run: node scripts/sync-version.mjs --check
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
